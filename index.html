<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LeonAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--tinta:#0d1b2a;--tinta-suave:#42566b;--creme:#faf7f2;--ouro:#b8893b;--verde:#1faa59;--borda:rgba(13,27,42,.10)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--creme);color:var(--tinta);font-family:'Inter',-apple-system,sans-serif;font-size:16px;line-height:1.6}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:680px;width:100%;margin:0 auto;padding:48px 20px}
.marca{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px}
.marca span{color:var(--ouro)}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(30px,6vw,44px);line-height:1.15;margin:28px 0 16px}
p{color:var(--tinta-suave);font-size:18px;margin:0 0 32px;max-width:540px}
.botao{align-self:flex-start;display:inline-block;background:var(--verde);color:#fff;font-weight:600;text-decoration:none;padding:14px 22px;border-radius:10px}
footer{max-width:680px;width:100%;margin:0 auto;padding:20px;border-top:1px solid var(--borda);font-size:14px;color:var(--tinta-suave)}
footer a{color:var(--tinta-suave)}
</style>
</head>
<body>
<main>
<div class="marca">Leon<span>AI</span></div>
<h1>Mais clientes pagando, não só mais curtidas.</h1>
<p>Agência de crescimento para negócios. Cuidamos do caminho inteiro: anúncio, atendimento no WhatsApp e agenda, com o olho no faturamento.</p>
<a class="botao" href="https://wa.me/5516981509249">Falar no WhatsApp</a>
</main>
<footer>LeonAI · <a href="privacidade.html">Política de privacidade</a></footer>
</body>
</html>
