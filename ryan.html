<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F6F6">
<meta property="og:title" content="Seu dia, com alguém do seu lado">
<meta property="og:description" content="Veja uma assistente no WhatsApp trabalhando de verdade, do bom-dia ao fechamento da semana.">
<title>Assistente Pessoal LeonAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&display=swap">
<style>
/* Mundo: só o celular, no escuro, com a luz do dia por trás dele mudando conforme a hora da conversa.
   Nada fora da tela além da marca. No celular, a conversa ocupa a tela inteira, como um WhatsApp de verdade. */
:root{
  color-scheme:dark;
  --night:#00142E; --navy:#001F45; --blue:#006CB6; --blue-2:#07639D; --yellow:#FDD200;
  --glow:#2A6FB0;
  --wa-bg:#EFEAE2; --wa-in:#FFFFFF; --wa-out:#D9FDD3; --wa-ink:#111B21; --wa-sub:#667781; --wa-green:#00A884;
  --good:#0A7D0A; --warn:#9A6B00;
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,'Helvetica Neue',Arial,sans-serif;
  --display:'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:#fff;font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(42% 46% at 50% 46%,var(--glow) 0%,transparent 72%);opacity:.55;transition:background 1.6s var(--ease)}
.brand{position:fixed;top:20px;left:24px;z-index:2;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:1.3rem;letter-spacing:-.01em;color:#fff}
.brand b{color:var(--yellow)}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:.8rem;color:#8FA6C2;z-index:2}
.stage{position:relative;z-index:1;height:100%;display:grid;place-items:center;padding:16px}

.phone{height:min(820px,calc(100vh - 96px));aspect-ratio:9/19.3;max-width:100%;border-radius:56px;background:#0a0a0c;padding:12px;position:relative;box-shadow:0 50px 100px -40px rgba(0,0,0,.8),inset 0 0 0 1.5px #2b2b30}
.island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:30%;height:30px;border-radius:20px;background:#000;z-index:4}
.sbar{position:absolute;top:22px;left:38px;z-index:4;font:600 .84rem var(--ui);color:var(--wa-ink);font-variant-numeric:tabular-nums}
.chat{height:100%;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;background:var(--wa-bg);color:var(--wa-ink)}
.head{display:flex;align-items:center;gap:10px;padding:50px 12px 10px;background:#F6F6F6;border-bottom:1px solid #E3E3E3;position:relative}
.back{color:#007AFF;display:flex}.back svg{width:22px;height:22px}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--blue);color:#fff;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:1.05rem}
.who{display:grid;line-height:1.2;min-width:0;flex:1}
.who b{font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:.76rem;color:var(--wa-sub);transition:color .2s}
.who small.typing-s{color:var(--wa-green)}
.ctl{display:flex;gap:6px}
.ctl button{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:#007AFF;display:grid;place-items:center;cursor:pointer}
.ctl button:hover{background:#E9EEF3}
.ctl svg{width:20px;height:20px}
.prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--blue);transition:width .6s var(--ease)}

.feed{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:5px;padding:10px 12px 10px;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feed > :first-child{margin-top:auto}
.day{align-self:center;font:600 .7rem var(--ui);letter-spacing:.04em;color:#54656F;background:#E1F2FB;border-radius:7px;padding:4px 10px;margin:8px 0 4px}
.b{max-width:84%;padding:6px 8px 5px 9px;border-radius:9px;font-size:.9rem;line-height:1.38;box-shadow:0 1px .5px rgba(11,20,26,.13);position:relative;overflow-wrap:anywhere}
.b.wide{max-width:90%;width:90%}
.b.in{align-self:flex-start;background:var(--wa-in);border-top-left-radius:0}
.b.out{align-self:flex-end;background:var(--wa-out);border-top-right-radius:0}
.b.in::before,.b.out::before{content:"";position:absolute;top:0;width:0;height:0;border-style:solid}
.b.in::before{left:-7px;border-width:0 8px 9px 0;border-color:transparent var(--wa-in) transparent transparent}
.b.out::before{right:-7px;border-width:0 0 9px 8px;border-color:transparent transparent transparent var(--wa-out)}
.meta{float:right;display:inline-flex;align-items:center;gap:3px;margin:7px 0 -3px 10px;font-size:.66rem;color:var(--wa-sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.ticks{width:16px;height:11px;color:#53BDEB}
.b strong{font-weight:600}
.fwd{display:block;font-size:.74rem;color:var(--wa-sub);font-style:italic;margin-bottom:2px}
.pop{animation:pop .42s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.typing{align-self:flex-start;background:var(--wa-in);border-radius:9px;border-top-left-radius:0;padding:11px 13px;display:inline-flex;gap:4px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.typing i{width:7px;height:7px;border-radius:50%;background:#8FA4AE;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}

/* áudio */
.au{display:flex;align-items:center;gap:8px;min-width:210px}
.au-play{width:24px;display:grid;place-items:center;color:#54656F}.au-play svg{width:20px;height:20px}
.au-wave{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.au-wave i{display:block;width:3px;border-radius:2px;background:#8FA4AE;transition:background .12s}
.au-wave i.on{background:#34B7F1}
.au-ava{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;position:relative}
.au-ava svg{width:15px;height:15px}
.au-ava .mk{position:absolute;right:-3px;bottom:-2px;width:15px;height:15px;border-radius:50%;background:#fff;color:#8FA4AE;display:grid;place-items:center}
.au-ava .mk svg{width:9px;height:9px}
.au-ava.heard .mk{color:#34B7F1}
.au-tx{font-size:.78rem;color:#54656F;font-style:italic;margin-top:3px}

/* cartões dentro da conversa */
.card{display:block;margin:7px 0 2px;border-radius:12px;overflow:hidden;border:1px solid #E3E8EE;background:#fff}
.ch{display:flex;justify-content:space-between;gap:8px;padding:8px 11px;background:var(--navy);color:#fff;font:700 .7rem var(--ui);letter-spacing:.05em}
.ch{align-items:center}.ch span{color:var(--yellow);white-space:nowrap;flex:none}
.cb{display:grid;gap:7px;padding:9px 11px;font-size:.84rem;line-height:1.35}
.li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:baseline}
.li .t{font-weight:700;color:#3A5170;font-variant-numeric:tabular-nums}
.li .s{color:var(--wa-sub);font-size:.76rem}
.ok{color:var(--good);font-weight:700}
.wr{color:var(--warn);font-weight:700}
.pri{background:#FFF4C2;color:#3B3000;border-radius:8px;padding:7px 9px;font-weight:600}
.pri b{font-weight:800}
.dot{display:grid;grid-template-columns:16px 1fr;gap:6px}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);margin-top:7px}
.big{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:1.7rem;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.big small{font:600 .78rem var(--ui);color:var(--wa-sub);margin-left:4px}
.bar{height:8px;border-radius:8px;background:#EDF1F5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--good);width:0;transition:width 1.1s var(--ease)}
.row2{display:flex;justify-content:space-between;gap:10px}
.row2 span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.sep{height:1px;background:#EDF1F5}
.draft{display:block;margin-top:7px;background:#FFF6CC;border-radius:10px;padding:9px 11px;font-size:.86rem;line-height:1.4;color:#1F1A00}
.draft i{display:block;font-style:normal;font-weight:700;font-size:.66rem;letter-spacing:.05em;color:#6B5A00;margin-bottom:4px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4 div{background:#F4F7FA;border-radius:8px;padding:8px 9px;display:grid}
.grid4 b{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:1.35rem;line-height:1.05;color:var(--navy);font-variant-numeric:tabular-nums}
.grid4 span{font-size:.72rem;color:var(--wa-sub)}

/* campo de digitação */
.composer{display:flex;align-items:center;gap:8px;padding:8px 10px 22px;background:#F6F6F6;border-top:1px solid #E3E3E3}
.field{flex:1;min-width:0;min-height:40px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:20px;padding:8px 14px;color:#8696A0;font-size:.92rem;border:1px solid #E3E3E3;white-space:nowrap;overflow:hidden}
.field.typed{color:var(--wa-ink)}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--wa-green);animation:blink 1s steps(1) infinite;flex:none}
@keyframes blink{50%{opacity:0}}
.rec-dot{width:9px;height:9px;border-radius:50%;background:#E53935;animation:blink .9s infinite;flex:none}
.send{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--wa-green);color:#fff;display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.send svg{width:20px;height:20px}
.send.rec{background:#E53935;transform:scale(1.15)}
.send.push{transform:scale(.88)}

.end{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(0,20,46,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .4s}
.end.show{opacity:1;pointer-events:auto}
.end button{border:0;border-radius:999px;background:var(--yellow);color:var(--navy);font:700 1rem var(--ui);padding:14px 24px;display:inline-flex;gap:10px;align-items:center;cursor:pointer;box-shadow:0 12px 28px -12px rgba(0,0,0,.6)}
.end button svg{width:18px;height:18px}

@media (max-width:560px){
  .stage{padding:0}
  .brand,.hint,.glow{display:none}
  .phone{height:100vh;height:100svh;width:100%;aspect-ratio:auto;border-radius:0;padding:0;box-shadow:none;background:var(--wa-bg)}
  .island,.sbar{display:none}
  .chat{border-radius:0}
  .head{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .composer{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .end{position:fixed}
}
@media (prefers-reduced-motion:reduce){
  .pop,.typing i,.caret,.rec-dot{animation:none}
  .glow,.bar i,.prog{transition:none}
}
</style>
</head>
<body>


<div class="glow" id="glow" aria-hidden="true"></div>
<div class="brand">Leon<b>AI</b></div>
<main class="stage">
  <div class="phone">
    <div class="island"></div>
    <span class="sbar" id="clock">07:00</span>
    <div class="chat">
      <div class="head">
        <span class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></span>
        <span class="ava">A</span>
        <div class="who"><b>Sua assistente</b><small id="status">online</small></div>
        <div class="ctl">
          <button type="button" id="pause" aria-label="Pausar"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
          <button type="button" id="restart" aria-label="Recomeçar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        </div>
        <span class="prog" id="prog"></span>
      </div>
      <div class="feed" id="feed" aria-live="polite"></div>
      <div class="composer">
        <div class="field" id="field">Mensagem</div>
        <span class="send" id="send" aria-hidden="true"></span>
      </div>
    </div>
    <div class="end" id="end"><button type="button" id="again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Ver de novo</button></div>
  </div>
</main>
<p class="hint">Conversa de exemplo</p>

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var feed = $('#feed'), field = $('#field'), send = $('#send'), status = $('#status'), clock = $('#clock'), prog = $('#prog'), glow = $('#glow'), endEl = $('#end');

  var I = {
    mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l.1 6.5L15 12l-11.5 1.9z"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5Z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    ticks: '<svg class="ticks" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6l3 3 6-7M6 8l1 1 6-7"/></svg>'
  };
  var WAVE = [6,10,15,9,13,19,11,7,16,21,13,8,14,18,10,7,12,17,9,13,7,11,15,8];

  /* ---------- cartões ---------- */
  function card(h, tag, body){ return '<span class="card"><span class="ch">' + h + (tag ? '<span>' + tag + '</span>' : '') + '</span><span class="cb">' + body + '</span></span>'; }
  function li(t, a, s, r){ return '<span class="li"><span class="t">' + t + '</span><span>' + a + (s ? '<br><span class="s">' + s + '</span>' : '') + '</span><span>' + (r || '') + '</span></span>'; }
  var CARDS = {
    agenda: card('TERÇA · SEU DIA', '3 REUNIÕES',
      li('09:00', 'Carlos Menezes', '1ª reunião · indicação do Rafael') +
      li('11:30', 'Paula Ribeiro', 'revisão da apólice') +
      li('15:00', 'Rafael Dias', 'revisão anual') +
      '<span class="pri">Prioridade única: <b>mandar a proposta do Lucas até as 11h</b></span>'),
    brief: card('EM 20 MIN · CARLOS MENEZES', '',
      '<span class="dot">Indicação do Rafael, que é seu cliente há 3 anos</span>' +
      '<span class="dot">Casado, dois filhos: Lia (7) e Davi (4)</span>' +
      '<span class="dot">Na última conversa falou de sucessão da empresa da família</span>' +
      '<span class="dot">Hoje tem seguro de vida, sem cobertura de invalidez</span>' +
      '<span class="pri">Oportunidade: <b>proteção de renda pra família</b></span>'),
    fuel: card('COMBUSTÍVEL · OUTUBRO', 'EMPRESA',
      '<span class="row2"><span>R$ 640 de R$ 1.000</span><span class="ok">64%</span></span><span class="bar"><i data-w="64%"></i></span>'),
    paula: '<span class="draft"><i>RASCUNHO PRA PAULA</i>Oi, Paula! Vi sua mensagem. Fica tranquila, eu resolvo isso com você. Vou gerar a 2ª via hoje e te mando até as 18h.</span>',
    todo: card('TIREI DA SUA CABEÇA', '3 ITENS',
      '<span class="pri">Agora: <b>almoçar</b></span>' +
      li('14:00', 'Ligar pro Rafael', '5 minutos') +
      li('amanhã', 'Pagar o cartão', 'às 8h30, antes da 1ª reunião')),
    money: card('OUTUBRO · SEU DINHEIRO', '',
      '<span class="big">R$ 1.240<small>livres até dia 31</small></span><span class="sep"></span>' +
      '<span class="row2"><span>Seu salário fixo</span><span class="ok">R$ 6.500 · pago</span></span>' +
      '<span class="row2"><span>Cheque especial</span><span>zera em novembro</span></span>' +
      '<span class="row2"><span>Cartão</span><span>quita em janeiro</span></span>' +
      '<span class="pri">Janeiro vem mais fraco. O caixa da empresa cobre, e o seu salário não muda.</span>'),
    pipe: card('PROPOSTAS EM ABERTO', 'R$ 7.400 EM JOGO',
      li('sex', 'Fernanda Lopes', 'R$ 4.100 de comissão', '<span class="wr">vence</span>') +
      li('hoje', 'Lucas Andrade', 'R$ 3.300 de comissão', '<span class="ok">enviada</span>')),
    bday: '<span class="draft"><i>MENSAGEM PRONTA</i>Paula, feliz aniversário! Que esse ano venha leve. Conta comigo pro que precisar. Abraço!</span>',
    close: card('FECHAMENTO · TERÇA', '',
      li('✓', '3 de 3 reuniões', '', '') +
      li('✓', 'Proposta do Lucas enviada', 'a prioridade do dia', '') +
      li('✓', 'Paula respondida', 'em 4 minutos', '') +
      li('R$', 'R$ 214 em gastos', 'tudo lançado', '') +
      '<span class="pri">Amanhã às 9h: <b>follow-up da Fernanda</b>, já escrito</span>'),
    week: card('SUA SEMANA', '',
      '<span class="grid4"><span><b>11</b><span>reuniões</span></span><span><b>3</b><span>propostas</span></span><span><b>2</b><span>apólices</span></span><span><b>R$ 9.800</b><span>comissão prevista</span></span></span>' +
      '<span class="pri">Semana que vem: 2 revisões anuais e 4 indicações pra ligar. Já está tudo na agenda.</span>')
  };

  /* ---------- roteiro: um dia de um Life Planner com a assistente ---------- */
  var IN = function(t, html, o){ return Object.assign({ who: 'in', t: t, html: html }, o || {}); };
  var OUT = function(t, text, o){ return Object.assign({ who: 'out', t: t, text: text }, o || {}); };
  var AUD = function(t, dur, say){ return { who: 'audio', t: t, dur: dur, say: say }; };
  var DAY = function(label){ return { who: 'day', label: label }; };
  var S = [
    DAY('HOJE'),
    IN('07:00', 'Bom dia! Seu dia:' + CARDS.agenda, { wide: true }),
    OUT('07:02', 'valeu. tô meio sem energia hoje'),
    IN('07:02', 'Então vamos no simples. Hoje só a proposta do Lucas importa. O resto eu seguro e te chamo na hora de cada coisa.'),
    IN('08:40', 'Em 20 minutos:' + CARDS.brief, { wide: true }),
    OUT('08:41', 'boa, tinha esquecido dos filhos dele'),
    IN('08:41', 'Por isso eu tô aqui. Boa reunião!'),
    AUD('10:12', '0:03', 'paguei 80 de gasolina'),
    IN('10:12', 'Lancei na conta da empresa:' + CARDS.fuel, { wide: true }),
    OUT('10:50', 'mandei a proposta do Lucas'),
    IN('10:50', 'Prioridade do dia feita, antes das 11h. 👏'),
    OUT('11:40', '<span class="fwd">↪ Encaminhada</span>Oi! Meu boleto da apólice voltou. E agora, vou perder o seguro? 😟', { raw: true }),
    OUT('11:40', 'nem consigo pensar nisso agora'),
    IN('11:41', 'Tudo bem, deixa comigo. O pagamento não passou e ela ficou com medo. Escrevi uma resposta, confere:' + CARDS.paula, { wide: true }),
    OUT('11:44', 'mandei'),
    IN('11:44', 'Pronto, <strong>4 minutos</strong>. Às 17h eu te lembro de gerar a 2ª via.'),
    AUD('13:05', '0:07', 'tenho que ligar pro Rafael, o cartão vence amanhã e eu nem almocei'),
    IN('13:05', 'Anotei tudo e organizei:' + CARDS.todo, { wide: true }),
    OUT('15:30', 'quanto eu posso gastar esse mês?'),
    IN('15:30', 'Fiz a conta:' + CARDS.money, { wide: true }),
    OUT('16:05', 'travei'),
    IN('16:05', 'Normal depois de 3 reuniões. Faz só isso, 10 minutos: mandar pro Rafael o horário de quinta. Me avisa quando mandar.'),
    OUT('16:16', 'feito'),
    IN('16:16', 'Boa. Uma a menos. 💪'),
    IN('17:00', 'Hora da 2ª via da Paula. Cinco minutos e acabou.'),
    OUT('18:30', 'como estão minhas propostas?'),
    IN('18:30', 'Aqui:' + CARDS.pipe + 'Quer que eu deixe o follow-up da Fernanda pronto pra amanhã às 9h?', { wide: true }),
    OUT('18:31', 'quero'),
    IN('18:31', 'Feito. Amanhã às 9h ele chega escrito, é só mandar.'),
    IN('19:10', 'Quinta é aniversário da Paula, sua cliente desde 2023. Deixei a mensagem pronta:' + CARDS.bday, { wide: true }),
    IN('21:00', CARDS.close + 'Ficou alguma coisa na cabeça? Me manda que eu guardo.', { wide: true }),
    AUD('21:03', '0:04', 'lembrei que tenho que renovar o seguro do carro'),
    IN('21:03', 'Guardado pra sábado de manhã. Pode desligar a cabeça. Boa noite. 🌙'),
    DAY('SEXTA'),
    IN('17:00', 'Sua semana:' + CARDS.week, { wide: true }),
    OUT('17:02', 'nunca fechei uma semana tão leve'),
    IN('17:02', 'É assim que vai ser. Bom fim de semana!')
  ];

  /* luz do dia por trás do celular */
  var GLOW = [[7,'#2E7BC4'],[10,'#3C8ED6'],[13,'#0A74C4'],[16,'#07639D'],[19,'#1A4272'],[21,'#0B2A55']];
  function glowFor(t){ var h = parseInt(t, 10), c = GLOW[0][1]; GLOW.forEach(function(g){ if (h >= g[0]) c = g[1]; }); return c; }

  /* ---------- motor ---------- */
  var run = 0, paused = false, idx = 0;
  function wait(ms, my){
    return new Promise(function(res){
      var left = reduce ? Math.min(ms, 250) : ms, last = Date.now();
      (function tick(){
        if (my !== run) return res(false);
        var now = Date.now(); if (!paused) left -= (now - last); last = now;
        if (left <= 0) return res(true);
        setTimeout(tick, 40);
      })();
    });
  }
  var stick = true;
  feed.addEventListener('scroll', function(){ stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 90; }, { passive: true });
  function down(){ if (stick) feed.scrollTo({ top: feed.scrollHeight, behavior: reduce ? 'auto' : 'smooth' }); }
  function add(node){ if (!reduce) node.classList.add('pop'); feed.appendChild(node); down(); return node; }
  function el(cls, html){ var d = document.createElement('div'); d.className = cls; d.innerHTML = html; return d; }
  function bubbleIn(s){ var n = el('b in' + (s.wide ? ' wide' : ''), s.html + '<span class="meta">' + s.t + '</span>'); var b = n.querySelector('.bar i'); if (b) setTimeout(function(){ b.style.width = b.dataset.w; }, 250); return n; }
  function bubbleOut(s){ return el('b out', (s.raw ? s.text : esc(s.text)) + '<span class="meta">' + s.t + ' ' + I.ticks + '</span>'); }
  function bubbleAudio(s){
    return el('b out', '<div class="au"><span class="au-play">' + I.play + '</span><span class="au-wave">' + WAVE.map(function(h){ return '<i style="height:' + h + 'px"></i>'; }).join('') + '</span><span class="au-ava">' + I.mic + '<span class="mk">' + I.mic + '</span></span></div><div class="au-tx">“' + esc(s.say) + '”</div><span class="meta">' + s.dur + ' · ' + s.t + ' ' + I.ticks + '</span>');
  }
  function esc(t){ return t.replace(/[&<>]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function idle(){ field.className = 'field'; field.textContent = 'Mensagem'; send.className = 'send'; send.innerHTML = I.mic; }
  function setTime(t){ clock.textContent = t; glow.style.setProperty('--glow', glowFor(t)); document.documentElement.style.setProperty('--glow', glowFor(t)); }

  async function step(s, my){
    if (s.who === 'day') { add(el('day', s.label)); return wait(500, my); }
    setTime(s.t);
    if (s.who === 'in') {
      status.textContent = 'digitando…'; status.className = 'typing-s';
      var t = add(el('typing', '<i></i><i></i><i></i>'));
      var ok = await wait(900 + Math.min(1700, s.html.replace(/<[^>]+>/g, '').length * 9), my);
      t.remove(); status.textContent = 'online'; status.className = '';
      if (!ok) return false;
      add(bubbleIn(s));
      return wait(s.html.indexOf('card') > -1 || s.html.indexOf('draft') > -1 ? 3600 : 1700, my);
    }
    if (s.who === 'audio') {
      send.className = 'send rec'; send.innerHTML = I.mic;
      field.className = 'field typed'; field.innerHTML = '<span class="rec-dot"></span><span id="rt">0:00</span><span style="margin-left:auto;color:#8696A0">gravando…</span>';
      var secs = parseInt(s.dur.split(':')[1], 10);
      for (var k = 1; k <= secs; k++) { if (!(await wait(reduce ? 50 : 420, my))) return false; var rt = document.getElementById('rt'); if (rt) rt.textContent = '0:0' + k; }
      idle();
      var a = add(bubbleAudio(s));
      if (!(await wait(700, my))) return false;
      var bars = a.querySelectorAll('.au-wave i');
      for (var b = 0; b < bars.length; b++) { bars[b].classList.add('on'); if (!(await wait(reduce ? 0 : 45, my))) return false; }
      a.querySelector('.au-ava').classList.add('heard');
      return wait(500, my);
    }
    /* mensagem escrita: digita no campo e envia */
    var plain = s.raw ? null : s.text;
    if (plain) {
      field.className = 'field typed'; send.innerHTML = I.send;
      var per = Math.max(18, Math.min(55, 1300 / plain.length));
      for (var c = 1; c <= plain.length; c++) {
        field.innerHTML = esc(plain.slice(0, c)) + '<span class="caret"></span>';
        if (!(await wait(per, my))) return false;
      }
      if (!(await wait(350, my))) return false;
      send.className = 'send push';
      if (!(await wait(140, my))) return false;
    }
    idle();
    add(bubbleOut(s));
    return wait(1000, my);
  }

  async function play(fromRest){
    var my = ++run; idle(); endEl.className = 'end'; stick = true;
    if (fromRest) idx = 2; else { idx = 0; feed.innerHTML = ''; }
    while (idx < S.length) {
      prog.style.width = (idx / S.length * 100) + '%';
      var ok = await step(S[idx], my);
      if (my !== run || ok === false) return;
      idx++;
    }
    prog.style.width = '100%';
    if (my === run) endEl.className = 'end show';
  }

  /* estado inicial já completo: o bom-dia na tela antes de tudo começar */
  function rest(){
    feed.innerHTML = ''; feed.appendChild(el('day', 'HOJE'));
    var n = bubbleIn(S[1]); feed.appendChild(n); setTime('07:00');
    var b = n.querySelector('.bar i'); if (b) b.style.width = b.dataset.w;
  }

  $('#pause').addEventListener('click', function(){
    paused = !paused;
    this.innerHTML = paused ? I.play : I.pause;
    this.setAttribute('aria-label', paused ? 'Continuar' : 'Pausar');
  });
  function restart(){ paused = false; $('#pause').innerHTML = I.pause; $('#pause').setAttribute('aria-label', 'Pausar'); play(false); }
  $('#restart').addEventListener('click', restart);
  $('#again').addEventListener('click', restart);

  idle(); rest();
  setTimeout(function(){ play(true); }, 1600);
})();
</script>

</body>
